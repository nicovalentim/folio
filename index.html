<html>

<head>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="imagens/favicon.ico">
    <title>nicovalentim</title>
</head>

<body>
    <nav>
        nicovalentim
        <div>
            <a href="#home">home</a> -
            <a href="#sobre">sobre</a> -
            <a href="#projetos">projetos</a> -
            <a href="#contato">contato</a>
        </div>
    </nav>

    <section id="home" data-nav-color="rgb(var(--luminosidadeAlta))">

        <header>
            <h2>subtítulo da seção</h2>
            <h1>Um texto de lorem ipsum que <span class="marcado">eu quero</span> usar de título.</h1>
            <p>Um texto de lorem ipsum que eu quero usar de subtítulo</p>
        </header>

    </section>

    <section id="projetos" data-nav-color="rgb(var(--luminosidadeBaixa))">

        <h2>projetos</h2>

        <div class="carrossel">
            <button class="seta seta-esquerda" id="btnAnterior">&lt;</button>

            <div class="carrossel-container" id="projetosContainer">
                <p id="projetosLoading">carregando projetos...</p>
            </div>

            <button class="seta seta-direita" id="btnProximo">&gt;</button>
        </div>

    </section>

    <section id="sobre" data-nav-color="rgb(var(--luminosidadeAlta))">

        <h2>quem sou</h2>
        <img src="imagens/sobre.gif" />

    </section>

    <section id="contato" data-nav-color="rgb(var(--luminosidadeBaixa))">

        <h2>contato</h2>
        <h1>Fale comigo!</h1>
        <form class="form" id="contato" onsubmit="return false;">
            <label>Nome</label>
            <input type="text" name="contatoNome" placeholder="Digite seu nome" required />
            <label>Assunto</label>
            <input type="text" name="contatoAssunto" placeholder="Digite o assunto" required />
            <label>Mensagem</label>
            <textarea name="contatoMensagem" placeholder="Digite sua mensagem aqui" required ></textarea>
            <button name="enviarEmail" type="submit">Enviar</button>
        </form>

    </section>

<script src="script.js"></script>
</body>
</html>
