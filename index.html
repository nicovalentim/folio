<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="imagens/favicon.ico">
    <title>nicovalentim</title>
</head>

<body>
    <nav>
        nicovalentim
        - <button id="btnIdioma" class="btn-lang"></button>
        <div>
            <a href="#home" data-i18n="navHome"></a> -
            <a href="#projetos" data-i18n="navProjetos"></a> -
            <a href="#sobre" data-i18n="navSobre"></a> -
            <a href="#contato" data-i18n="navContato"></a>
        </div>
    </nav>

    <section id="home" data-nav-color="rgb(var(--luminosidadeAlta))">

        <header>
            <h2 data-i18n="homeSubtitulo"></h2>
            <h1 data-i18n="homeTitulo"></h1>
            <p data-i18n="homeDescricao"></p>
        </header>

    </section>

    <section id="projetos" data-nav-color="rgb(var(--luminosidadeBaixa))">

        <div class="carrossel">
            <button class="seta" id="btnAnterior"><</button>

            <div class="carrosselContainer" id="projetosContainer">
                <p data-i18n="carregando"></p>
            </div>

            <button class="seta" id="btnProximo">></button>
        </div>

    </section>

    <section id="sobre" data-nav-color="rgb(var(--luminosidadeBaixa))">

        <img id="imgSobre" data-i18n-src="imgSobre" />

    </section>

    <section id="contato" data-nav-color="rgb(var(--luminosidadeAlta))">

        <div class="contatoContainer">
            <h1 data-i18n="contatoTitulo"></h1>
            <form class="form" id="contato" onsubmit="return false;">
                <label data-i18n="labelNome"></label>
                <input type="text" name="contatoNome" data-i18n-placeholder="placeholderNome" required />
                <label data-i18n="labelAssunto"></label>
                <input type="text" name="contatoAssunto" data-i18n-placeholder="placeholderAssunto" required />
                <label data-i18n="labelMensagem"></label>
                <textarea name="contatoMensagem" data-i18n-placeholder="placeholderMensagem" required ></textarea>
                <button name="enviarEmail" type="submit" data-i18n="btnEnviar"></button>
            </form>
        </div>

    </section>

<script src="script.js"></script>
<script src="text.js"></script>
</body>
</html>
